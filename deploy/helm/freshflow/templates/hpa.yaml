{{- if .Values.hpa.orderService.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "freshflow.fullname" . }}-order-service
  labels:
    {{- include "freshflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: order-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "freshflow.fullname" . }}-order-service
  minReplicas: {{ .Values.hpa.orderService.minReplicas }}
  maxReplicas: {{ .Values.hpa.orderService.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.hpa.orderService.averageCPUUtilization }}
{{- end }}

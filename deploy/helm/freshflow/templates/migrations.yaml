apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "freshflow.fullname" . }}-postgres-migrate
  labels:
    {{- include "freshflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres-migrate
spec:
  backoffLimit: 8
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: postgres-migrate
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36.1
          command: [sh, -ec, until nc -z {{ include "freshflow.fullname" . }}-postgres 5432; do sleep 2; done]
      containers:
        - name: migrate
          image: {{ .Values.images.postgresMigrations | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - name: FRESHFLOW_POSTGRES_DSN
              valueFrom: {secretKeyRef: {name: {{ include "freshflow.fullname" . }}-runtime, key: FRESHFLOW_POSTGRES_DSN}}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "freshflow.fullname" . }}-clickhouse-migrate
  labels:
    {{- include "freshflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse-migrate
spec:
  backoffLimit: 8
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: clickhouse-migrate
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-clickhouse
          image: busybox:1.36.1
          command: [sh, -ec, until nc -z {{ include "freshflow.fullname" . }}-clickhouse 9000; do sleep 2; done]
      containers:
        - name: migrate
          image: {{ .Values.images.clickhouseMigrations | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          envFrom:
            - configMapRef: {name: {{ include "freshflow.fullname" . }}-runtime}
            - secretRef: {name: {{ include "freshflow.fullname" . }}-runtime}

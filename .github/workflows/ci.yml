name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/eta-service/requirements-dev.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Go test, vet and build
        run: |
          go test ./... -count=1
          go vet ./...
          go build ./services/...
      - name: ETA service tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ml/eta-service/requirements-dev.txt
          PYTHONPATH=ml/eta-service python -m pytest ml/eta-service/tests
      - name: Frontend checks
        run: |
          node --check web/app.js
          node --test web/tests/*.test.js
      - name: Compose and OpenAPI validation
        run: |
          docker compose config --quiet
          npx --yes @redocly/cli@1.25.2 lint contracts/openapi/freshflow.yaml

  helm:
    name: Helm validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - name: Lint and render chart
        run: |
          helm lint deploy/helm/freshflow
          helm template freshflow deploy/helm/freshflow > /dev/null

  compose-e2e:
    name: Compose end-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [quality]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build and start local stack
        run: docker compose up -d --build --wait
      - name: API and web smoke test
        run: pwsh -NoProfile -File scripts/smoke.ps1
      - name: Go integration test
        run: FRESHFLOW_INTEGRATION=1 go test ./tests/integration -count=1
      - name: Short checkout load check
        run: FRESHFLOW_LOAD_DURATION=10s FRESHFLOW_LOAD_READ_VUS=2 docker compose --profile load run --rm k6
      - name: Collect service diagnostics
        if: failure()
        run: docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: compose-diagnostics
          path: compose.log
          if-no-files-found: ignore
      - name: Stop stack
        if: always()
        run: docker compose down -v --remove-orphans

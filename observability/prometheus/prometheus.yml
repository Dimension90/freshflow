global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: freshflow-go
    static_configs:
      - targets:
          - api-gateway:8080
          - catalog-service:8081
          - cart-service:8082
          - order-service:8083
          - delivery-service:8084
          - courier-simulator:8085
          - notification-worker:8086
          - analytics-worker:8087
  - job_name: freshflow-eta
    static_configs:
      - targets: [eta-service:8090]
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

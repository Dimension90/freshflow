groups:
  - name: freshflow
    rules:
      - alert: FreshFlowHighHTTPErrorRatio
        expr: sum(rate(http_server_errors_total[5m])) / clamp_min(sum(rate(http_server_request_duration_seconds_count[5m])), 1) > 0.05
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: FreshFlow HTTP error ratio is above 5%
      - alert: FreshFlowKafkaConsumerLag
        expr: max(freshflow_kafka_consumer_lag) by (service, topic) > 100
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: Kafka consumer lag is growing
      - alert: FreshFlowETAServiceDown
        expr: up{job="freshflow-eta"} == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: ETA service cannot be scraped
